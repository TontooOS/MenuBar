[package]
name = "menubar"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "TontooOS Menubar — per-monitor transparent top bar"
authors = ["arlomu"]

[[bin]]
name = "menubar"
path = "src/main.rs"

[dependencies]
# TontooOS SDK: TontooUI (layer-shell bar), CoreIcon (symbols/octopus),
# CoreWindows (app classification, window actions), Accessibility (lang).
sdk = { path = "/Library/System/sdk", features = ["TontooUI", "CoreIcon", "CoreWindows", "Accessibility"] }
# X11 EWMH queries (active window, minimize/close) for app actions.
x11rb = { version = "0.13", features = ["randr", "shape"] }
vello = "0.10"
