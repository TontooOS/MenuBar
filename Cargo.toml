[package]
name = "menubar"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "TontooOS Menubar — per-monitor transparent top bar"
authors = ["arlomu"]

[[bin]]
name = "menubar"
path = "src/main.rs"

[dependencies]
sdk = { path = "/Library/System/sdk", features = ["UIKit", "CoreIcon", "CoreWindows", "Accessibility"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
gtk4-layer-shell = "0.5"
glib = "0.20"
x11rb = { version = "0.13", features = ["randr", "shape"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
